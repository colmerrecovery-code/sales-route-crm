services:
  db:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: sales_route_crm
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed-data.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d sales_route_crm"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      PORT: 4000
      DATABASE_URL: postgres://crm:crm@db:5432/sales_route_crm
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      OSRM_URL: ${OSRM_URL:-https://router.project-osrm.org}
      NOMINATIM_URL: ${NOMINATIM_URL:-https://nominatim.openstreetmap.org}
      # Mapbox. Unset = the app falls back to the free OpenStreetMap services.
      # MAPBOX_TOKEN is the SECRET token, used server-side for geocoding and routing.
      # MAPBOX_PUBLIC_TOKEN is handed to the browser for map tiles — restrict it by URL.
      MAPBOX_TOKEN: ${MAPBOX_TOKEN:-}
      MAPBOX_PUBLIC_TOKEN: ${MAPBOX_PUBLIC_TOKEN:-}
      MAPBOX_STYLE: ${MAPBOX_STYLE:-mapbox/streets-v12}
      # Stored coordinates require Mapbox's permanent licence. Only set this to
      # false if you are NOT keeping the results.
      MAPBOX_PERMANENT: ${MAPBOX_PERMANENT:-true}
      # false = keep address lookup on the free OpenStreetMap services while
      # routing and tiles use Mapbox. Only address lookup costs money.
      MAPBOX_GEOCODING: ${MAPBOX_GEOCODING:-true}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      DB_SQL_DIR: /database
    volumes:
      - ./database:/database:ro
    ports: ["4000:4000"]
    depends_on:
      db: { condition: service_healthy }

  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [backend]

volumes:
  pgdata:
